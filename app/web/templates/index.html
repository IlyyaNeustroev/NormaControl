<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Document GraphRAG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">Реестр документов предприятия</h1>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Код</th>
                <th>Название</th>
                <th>Тип</th>
                <th>Статус</th>
                <th>Дата ввода</th>
                <th>Владелец</th>
            </tr>
        </thead>
        <tbody>
            {% for document in documents %}
            <tr>
                <td>{{ document.code }}</td>
                <td><a href="/document/{{ document.id }}">{{ document.title }}</a></td>
                <td>{{ document.document_type }}</td>
                <td>{{ document.status }}</td>
                <td>{{ document.effective_date }}</td>
                <td>{{ document.owner }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="card mt-4">
        <div class="card-body">
            <h5>Вопрос к документам</h5>
            <input id="question" class="form-control mb-2" placeholder="Например: какая версия инструкции действует сейчас?">
            <button id="ask" class="btn btn-primary">Спросить</button>
            <pre id="answer" class="mt-3"></pre>
        </div>
    </div>
</div>

<script>
document.getElementById("ask").onclick = async () => {
    const question = document.getElementById("question").value;
    const response = await fetch("/api/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
    });
    const data = await response.json();
    document.getElementById("answer").textContent = data.answer || JSON.stringify(data, null, 2);
};
</script>
</body>
</html>
